<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simuladores de matemáticas IETAL</title>
<style>
:root{--bg:#f6f5f1;--card:#ffffff;--ink:#1d1f23;--mute:#5d6470;--line:#d9dbe0;--acc:#1f497d;--acc2:#e8eef6;--warn:#a5361d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16181c;--card:#1f2228;--ink:#e9eaed;--mute:#a3a9b4;--line:#353a43;--acc:#8fb3e3;--acc2:#24324a;--warn:#f08a6e}}
:root[data-theme="dark"]{--bg:#16181c;--card:#1f2228;--ink:#e9eaed;--mute:#a3a9b4;--line:#353a43;--acc:#8fb3e3;--acc2:#24324a;--warn:#f08a6e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Arial,Helvetica,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;gap:14px;align-items:center}
header img{width:64px;height:64px;border-radius:50%;flex:none}
header h1{font-size:22px;margin:0 0 2px;color:var(--acc)}
header p{margin:0;color:var(--mute);font-size:14px}
h2{font-size:20px;margin:0 0 8px;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:16px 0}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.grade{display:block;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.grade:hover{border-color:var(--acc)}
.grade.on{border-color:var(--acc);background:var(--acc2)}
.grade b{display:block;font-size:19px;color:var(--acc)}
.grade span{color:var(--mute);font-size:15px}
.tema{background:var(--acc2);border-radius:8px;padding:12px 14px;margin-top:14px}
.tema h3{margin:0 0 6px;font-size:18px}
.tema ol{margin:6px 0 0;padding-left:22px}
button.go{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--card);cursor:pointer;margin-top:14px}
.hidden{display:none !important}
.stat{font-size:15px;color:var(--mute)}
</style>
</head>

tat\" id=\"team\"><\/p>\n<p class=\"stat\">El progreso suma todo lo que cada estudiante ha hecho en este computador, también en clases anteriores.<\/p>\n<div class=\"sescards\" id=\"sescards\"><\/div>\n<div class=\"row\"><button class=\"sec\" id=\"btnOut\">Terminar y cambiar de equipo<\/button><\/div>\n<\/div>\n<\/section>\n\n<section id=\"ses\" class=\"hidden\">\n<div class=\"card\">\n<div class=\"row\" style=\"margin-top:0;justify-content:space-between\"><h2 id=\"sesTitle\" style=\"margin:0\"><\/h2><button class=\"sec sm\" id=\"btnMenu\">Volver a las sesiones<\/button><\/div>\n<div class=\"tabs\" id=\"tabs\"><\/div>\n<\/div>\n<div id=\"stage\"><\/div>\n<\/section>\n\n<section id=\"bye\" class=\"card hidden\">\n<p class=\"score\">Datos guardados.<\/p>\n<p>Gracias. Avisa al docente que terminaron.<\/p>\n<p class=\"stat\" id=\"byeNet\"><\/p>\n<div class=\"row\"><button id=\"btnNext\" class=\"sec\">Siguiente equipo<\/button><\/div>\n<\/section>\n\n<section id=\"panel\" class=\"card hidden\">\n<h2>Panel del docente<\/h2>\n<div id=\"pinBox\">\n<label class=\"f\" for=\"pin\" id=\"pinLabel\">Clave del docente<\/label>\n<input type=\"password\" id=\"pin\" autocomplete=\"off\">\n<p id=\"pinErr\" class=\"err\"><\/p>\n<div class=\"row\"><button id=\"btnPin\">Entrar<\/button><button class=\"sec\" id=\"btnClose1\">Cerrar<\/button><\/div>\n<\/div>\n<div id=\"panelBody\" class=\"hidden\">\n<label class=\"f\" for=\"equipo\">Número del equipo<\/label>\n<input type=\"text\" id=\"equipo\" placeholder=\"Ejemplo: 3\">\n<label class=\"f\" for=\"modo\">Uso<\/label>\n<select id=\"modo\"><option value=\"Clase\">Clase<\/option><option value=\"Piloto\">Prueba piloto<\/option><option value=\"Docente\">Prueba del docente<\/option><\/select>\n<div class=\"row\"><button id=\"btnSave\">Guardar ajustes<\/button><\/div>\n<p class=\"stat\" id=\"stat\"><\/p>\n<p id=\"dlMsg\" class=\"warnbox hidden\"><\/p>\n<div class=\"row\">\n<button type=\"button\" id=\"btnXls\">Descargar registros en Excel<\/button>\n<button class=\"sec\" id=\"btnClose2\">Volver al simulador<\/button>\n<\/div>\n<p class=\"stat\">El Excel trae cuatro hojas con tablas. Registro: una fila por cada respuesta, con sesión, etapa (Explora, Practica o Comprueba), actividad, contenido, pregunta, opción elegida, si fue correcta, número de intento y segundos. Comprobación: una fila por estudiante y por cada vez que su equipo terminó la comprobación de una sesión, con pasos correctos y porcentaje. Por estudiante: retos logrados, acierto al primer intento en la práctica y mejor y último porcentaje de comprobación en cada sesión. Por contenido: acierto al primer intento por grupo y contenido. Si un equipo tiene varios integrantes, cada uno recibe los resultados del equipo.<\/p>\n<details><summary class=\"stat\">Vista previa de los registros (texto)<\/summary><pre id=\"prev\"><\/pre><\/details>\n<h3>Base de datos del simulador<\/h3>\n<p class=\"stat\">Los registros se guardan en este computador, dentro del navegador, y se conservan al cerrar y volver a abrir el simulador. Para que eso pase hay que abrir siempre el mismo archivo, desde la misma carpeta y con el mismo navegador. Si se borra el historial o los datos de navegación, la base se pierde; por eso conviene guardar una copia al final de cada jornada. Con la copia también se pasa el progreso de un computador a otro: se carga en el otro computador y los registros se suman sin repetirse.<\/p>\n<div class=\"row\">\n<button type=\"button\" id=\"btnBak\">Guardar copia de la base de datos<\/button>\n<button type=\"button\" class=\"sec\" id=\"btnLoad\">Cargar copia o datos de otro computador<\/button>\n<input type=\"file\" id=\"fileLoad\" accept=\".json,application/json\" class=\"hidden\" multiple>\n<\/div>\n<p id=\"bakMsg\" class=\"warnbox hidden\"><\/p>\n<div class=\"row\" style=\"margin-top:24px\"><button class=\"danger\" id=\"btnClear\">Borrar todos los registros de este equipo<\/button><\/div>\n<div id=\"clearBox\" class=\"hidden\">\n<p class=\"err\">Esto borra los registros guardados en este computador. Descarga antes el Excel. Escribe BORRAR para confirmar.<\/p>\n<input type=\"text\" id=\"clearTxt\">\n<div class=\"row\"><button class=\"danger\" id=\"btnClear2\">Confirmar borrado<\/button><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<footer><button type=\"button\" id=\"lnkGrado\">Cambiar de grado<\/button> <button type=\"button\" id=\"lnkPanel\">Panel del docente<\/button><\/footer>\n<\/div>\n\n<script>\n\n/* Generador de .xlsx sin conexion: tablas de Excel, sin librerias externas */\nconst XL = (() => {\n  const enc = new TextEncoder();\n  const CRC = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();\n  function crc32(b){ let c = 0xFFFFFFFF; for(let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }\n  function zip(files){\n    const parts = [], central = []; let off = 0;\n    files.forEach(f => {\n      const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);\n      const h = new DataView(new ArrayBuffer(30));\n      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);\n      h.setUint16(10, 0, true); h.setUint16(12, 0x5B21, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);\n      h.setUint16(26, name.length, true); h.setUint16(28, 0, true);\n      parts.push(new Uint8Array(h.buffer), name, data);\n      const c = new DataView(new ArrayBuffer(46));\n      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);\n      c.setUint16(12, 0, true); c.setUint16(14, 0x5B21, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);\n      c.setUint16(28, name.length, true); c.setUint32(42, off, true);\n      central.push(new Uint8Array(c.buffer), name);\n      off += 30 + name.length + data.length;\n    });\n    const csize = central.reduce((s, x) => s + x.length, 0);\n    const e = new DataView(new ArrayBuffer(22));\n    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);\n    return new Blob(parts.concat(central, [new Uint8Array(e.buffer)]), {type: \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\"});\n  }\n  const x = s => String(s).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\").replace(/\"/g, \"&quot;\");\n  function col(n){ let s = \"\"; n++; while(n){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }\n  /* sheets: [{name, title?, tables:[{name, head:[...], rows:[[...]], fmt:[style per col]}], widths:[...]}] */\n  function build(sheets){\n    const files = [];\n    let tid = 0; const tableFiles = [];\n    const sheetXml = sheets.map((sh, si) => {\n      let r = 1, rowsXml = \"\", rels = [], tparts = \"\";\n      if(sh.title){ rowsXml += '<row r=\"1\"><c r=\"A1\" t=\"inlineStr\" s=\"3\"><is><t>' + x(sh.title) + \"<\/t><\/is><\/c><\/row>\"; r = 3; }\n      sh.tables.forEach(tb => {\n        const nrow = Math.max(tb.rows.length, 1), r0 = r;\n        rowsXml += '<row r=\"' + r + '\">' + tb.head.map((h, j) => '<c r=\"' + col(j) + r + '\" t=\"inlineStr\" s=\"4\"><is><t>' + x(h) + \"<\/t><\/is><\/c>\").join(\"\") + \"<\/row>\";\n        r++;\n        const body = tb.rows.length ? tb.rows : [tb.head.map(() => \"\")];\n        body.forEach(row => {\n          rowsXml += '<row r=\"' + r + '\">' + row.map((v, j) => {\n            const ref = col(j) + r, s = (tb.fmt && tb.fmt[j]) || 0;\n            if(v === \"\" || v === null || v === undefined) return '<c r=\"' + ref + '\" s=\"' + s + '\"/>';\n            if(typeof v === \"number\" && isFinite(v)) return '<c r=\"' + ref + '\" s=\"' + s + '\"><v>' + v + \"<\/v><\/c>\";\n            return '<c r=\"' + ref + '\" t=\"inlineStr\" s=\"' + s + '\"><is><t xml:space=\"preserve\">' + x(v) + \"<\/t><\/is><\/c>\";\n          }).join(\"\") + \"<\/row>\";\n          r++;\n        });\n        tid++;\n        const ref = \"A\" + r0 + \":\" + col(tb.head.length - 1) + (r0 + nrow);\n        tableFiles.push({n: tid, xml: '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\\n<table xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" id=\"' + tid + '\" name=\"' + tb.name + '\" displayName=\"' + tb.name + '\" ref=\"' + ref + '\" totalsRowShown=\"0\"><autoFilter ref=\"' + ref + '\"/><tableColumns count=\"' + tb.head.length + '\">' + tb.head.map((h, j) => '<tableColumn id=\"' + (j + 1) + '\" name=\"' + x(h) + '\"/>').join(\"\") + '<\/tableColumns><tableStyleInfo name=\"TableStyleMedium2\" showFirstColumn=\"0\" showLastColumn=\"0\" showRowStripes=\"1\" showColumnStripes=\"0\"/><\/table>'});\n        rels.push(tid);\n        r += 2;\n      });\n      const cols = sh.widths ? \"<cols>\" + sh.widths.map((w, j) => '<col min=\"' + (j + 1) + '\" max=\"' + (j + 1) + '\" width=\"' + w + '\" customWidth=\"1\"/>').join(\"\") + \"<\/cols>\" : \"\";\n      files.push({name: \"xl/worksheets/_rels/sheet\" + (si + 1) + \".xml.rels\", text: '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\\n<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">' + rels.map((t, k) => '<Relationship Id=\"rT' + (k + 1) + '\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/table\" Target=\"../tables/table' + t + '.xml\"/>').join(\"\") + \"<\/Relationships>\"});\n      return '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\\n<worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\"><sheetViews><sheetView workbookViewId=\"0\"' + (si === 0 ? ' tabSelected=\"1\"' : \"\") + '/><\/sheetViews>' + cols + \"<sheetData>\" + rowsXml + '<\/sheetData><tableParts count=\"' + rels.length + '\">' + rels.map((t, k) => '<tablePart r:id=\"rT' + (k + 1) + '\"/>').join(\"\") + \"<\/tableParts><\/worksheet>\";\n    });\n    sheetXml.forEach((s, i) => files.push({name: \"xl/worksheets/sheet\" + (i + 1) + \".xml\", text: s}));\n    tableFiles.forEach(t => files.push({name: \"xl/tables/table\" + t.n + \".xml\", text: t.xml}));\n    files.push({name: \"[Content_Types].xml\", text: '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\\n<Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\"><Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/><Default Extension=\"xml\" ContentType=\"application/xml\"/><Override PartName=\"/xl/workbook.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml\"/><Override PartName=\"/xl/styles.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml\"/>' + sheets.map((_, i) => '<Override PartName=\"/xl/worksheets/sheet' + (i + 1) + '.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml\"/>').join(\"\") + tableFiles.map(t => '<Override PartName=\"/xl/tables/table' + t.n + '.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.table+xml\"/>').join(\"\") + \"<\/Types>\"});\n    files.push({name: \"_rels/.rels\", text: '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\\n<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"><Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"xl/workbook.xml\"/><\/Relationships>'});\n    files.push({name: \"xl/workbook.xml\", text: '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\\n<workbook xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\"><sheets>' + sheets.map((s, i) => '<sheet name=\"' + x(s.name) + '\" sheetId=\"' + (i + 1) + '\" r:id=\"rId' + (i + 1) + '\"/>').join(\"\") + \"<\/sheets><\/workbook>\"});\n    files.push({name: \"xl/_rels/workbook.xml.rels\", text: '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\\n<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">' + sheets.map((_, i) => '<Relationship Id=\"rId' + (i + 1) + '\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet\" Target=\"worksheets/sheet' + (i + 1) + '.xml\"/>').join(\"\") + '<Relationship Id=\"rId' + (sheets.length + 1) + '\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles\" Target=\"styles.xml\"/><\/Relationships>'});\n    files.push({name: \"xl/styles.xml\", text: '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\\n<styleSheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"><numFmts count=\"1\"><numFmt numFmtId=\"164\" formatCode=\"0.0%\"/><\/numFmts><fonts count=\"3\"><font><sz val=\"11\"/><name val=\"Calibri\"/><\/font><font><b/><sz val=\"14\"/><color rgb=\"FF1F497D\"/><name val=\"Calibri\"/><\/font><font><b/><sz val=\"11\"/><name val=\"Calibri\"/><\/font><\/fonts><fills count=\"2\"><fill><patternFill patternType=\"none\"/><\/fill><fill><patternFill patternType=\"gray125\"/><\/fill><\/fills><borders count=\"1\"><border><left/><right/><top/><bottom/><diagonal/><\/border><\/borders><cellStyleXfs count=\"1\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\"/><\/cellStyleXfs><cellXfs count=\"5\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\" xfId=\"0\"/><xf numFmtId=\"2\" fontId=\"0\" fillId=\"0\" borderId=\"0\" xfId=\"0\" applyNumberFormat=\"1\"/><xf numFmtId=\"164\" fontId=\"0\" fillId=\"0\" borderId=\"0\" xfId=\"0\" applyNumberFormat=\"1\"/><xf numFmtId=\"0\" fontId=\"1\" fillId=\"0\" borderId=\"0\" xfId=\"0\" applyFont=\"1\"/><xf numFmtId=\"0\" fontId=\"2\" fillId=\"0\" borderId=\"0\" xfId=\"0\" applyFont=\"1\"/><\/cellXfs><cellStyles count=\"1\"><cellStyle name=\"Normal\" xfId=\"0\" builtinId=\"0\"/><\/cellStyles><\/styleSheet>'});\n    return zip(files);\n  }\n  return {build};\n})();\n\n\n<\/script>\n<script>\nconst STUDENTS = {\"1001\": [[1, \"ACOSTA MENDOZA ESTRELLA ISABEL\"], [2, \"ALVAREZ GOMEZ ORIANA ALEJANDRA\"], [3, \"AVILA RAMOS MAURO SMITH\"], [4, \"BASSA VIZCAINO GLEIDIS PAOLA\"], [5, \"BELTRAN HURTADO LEANDRO ANTONIO\"], [6, \"CASTILLO CABALLERO MARIA GABRIELA\"], [7, \"ESCALANTE MANOTAS BRENDA MILAGRO\"], [8, \"FORTICH YEPEZ JOSUA DAVID\"], [9, \"GONZALEZ PEREZ DILAN JOSE\"], [10, \"JAIME SALAS KAROLAY VANESA\"], [11, \"JIMENEZ BARRAZA ISMAEL SANTIAGO\"], [12, \"JIMENEZ BARRAZA JEIRYL CARLOS\"], [13, \"LIÑAN GONZALEZ ISABELLA DE LA CHIQUINQU\"], [14, \"MENDOZA VILLANUEVA MAYRON DAVID\"], [15, \"MORALES ANGULO KATTY YULIETH\"], [16, \"MUÑOZ CANTILLO YENIFER CAROLINA\"], [17, \"OÑATE MONTERO JAVITH DARIO\"], [18, \"OSPINO MELENDEZ VALERIA CAMILA\"], [19, \"REYES MARRIAGA DANNA NICOL\"], [20, \"RIVERA HERNANDEZ SILVANA\"], [21, \"SUAREZ UMBRIA JOSE DAVID\"], [22, \"VARELA SERPA HOSLAYDYS YAIRES\"], [23, \"VILLA JIMENEZ JOSETH ALEJANDRO\"]], \"1002\": [[1, \"BARRIOS GONZALES JESUS DAVID\"], [2, \"BARRIOS PRENTH KERLYS MARIA\"], [3, \"CARRILLO ROA ANDRES FELIPE\"], [4, \"DE LA HOZ ARIZA SHADIA VALENTINA\"], [5, \"FIGUEREDO SANCHEZ MARLENIS\"], [6, \"FONTALVO PACHECO JESUS DAVID\"], [7, \"FRANCO RUIZ JHANS ROBERT\"], [8, \"GARCIA ALCAZAR STIVEN JOSE\"], [9, \"GONZALEZ HERNANDEZ YURIANA\"], [10, \"GONZALEZ RESTREPO CRISTINA ISABEL\"], [11, \"HERNANDEZ SANJUAN XAMIRA\"], [12, \"HIDALGO BELEÑO MARIA CAMILA\"], [13, \"HURTADO VILORIA MARIA ALEJANDRA\"], [14, \"JAIME SALAS KAROL VANESSA\"], [15, \"JIMENEZ BEDOYA YURLEIDIS\"], [16, \"MACHADO SANTOYA YIRALIS DESIREE\"], [17, \"MANZANILLA RODRIGUEZ RIXON RAFAEL\"], [18, \"OLIVEROS PERNET JHONATAN DAVID\"], [19, \"PACHECO BEUFORD DAYUSSI NICOL\"], [20, \"PACHECO GONZALEZ VALERIA VALENTINA\"], [21, \"PEREZ BUJATO MARIA ELVIRA\"], [22, \"PRENTH VIDAL EDER MANUEL\"], [23, \"ROA JIMENEZ BRENDA ISABEL\"], [24, \"SANTACRUZ FONTALVO ANDRES FELIPE\"], [25, \"SUAREZ ANGULO MARIANA\"], [26, \"TORRES REYES GILLIAM CAROLINA\"], [27, \"TORRES VELANDIA SARAHI VALENTINA\"], [28, \"YEPEZ MORALES VALERIE NICOLL\"]]};\nconst KEY = \"ietal_sim_trig10_v1\";\nconst L = \"abcd\";\nconst mem = {records: [], settings: {equipo: \"\", modo: \"Clase\", pin: \"\"}};\nlet rec = null, curSes = 0, curStage = 0;\n\n/* ---------- utilidades ---------- */\nconst $ = id => document.getElementById(id);\nfunction esc(s){ return String(s).replace(/[&<>\"]/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c])); }\nfunction fmt(v){ return String(Math.round(v * 100) / 100).replace(\".\", \",\"); }\nfunction ap(v){ return Math.abs(v * 100 - Math.round(v * 100)) < 1e-6 ? \" = \" : \" ≈ \"; }\nfunction len(v){ return Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : fmt(v); }\nfunction ratio(a, b){ const q = a / b, ex = Math.abs(q * 100 - Math.round(q * 100)) < 1e-9; return a + \"/\" + b + (ex ? \" = \" : \" ≈ \") + fmt(q); }\nfunction rnd(a){ return a[Math.floor(Math.random() * a.length)]; }\nfunction shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }\nfunction now(){ return performance.now(); }\nfunction secs(t0){ return Math.round((now() - t0) / 100) / 10; }\nconst R2 = v => Math.round(v * 100) / 100;\nfunction trig(d){ const r = d * Math.PI / 180; return {sen: R2(Math.sin(r)), cos: R2(Math.cos(r)), tan: R2(Math.tan(r))}; }\n\n/* ---------- almacenamiento ---------- */\nfunction load(){\n  try{\n    const r = localStorage.getItem(KEY + \"_rec\"); if(r) mem.records = JSON.parse(r) || [];\n    const s = localStorage.getItem(KEY + \"_set\"); if(s) Object.assign(mem.settings, JSON.parse(s));\n  }catch(e){}\n  mem.records.forEach(r => { if(!r.id) r.id = newId(); });\n  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}\n}\nfunction newId(){ return \"r\" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }\n/* progreso acumulado de un estudiante en todos los ingresos guardados en este computador */\nfunction prog(g, lista){\n  const out = {}; [1, 2, 3].forEach(n => out[n] = {retos: new Set(), best: null, last: null, n: 0});\n  mem.records.forEach(r => {\n    if(r.grupo !== g || !r.integrantes.some(x => x[0] === lista)) return;\n    r.ev.forEach(e => { if(e[1] === \"Explora\" && e[6] === 1 && out[e[0]]) out[e[0]].retos.add(e[2]); });\n    r.checks.forEach(c => { const o = out[c.ses]; o.n++; o.best = o.best === null ? c.pct : Math.max(o.best, c.pct); o.last = c.pct; });\n  });\n  return out;\n}\n/* primer reto que algún integrante del equipo aún no ha logrado */\nfunction resumeIdx(ses, total){\n  if(!rec) return 0;\n  const ps = rec.integrantes.map(x => prog(rec.grupo, x[0])[ses].retos);\n  for(let k = 0; k < total; k++) if(ps.some(st => !st.has(\"Reto \" + (k + 1)))) return k;\n  return total;\n}\nlet saveFail = false;\nfunction save(){\n  try{ localStorage.setItem(KEY + \"_rec\", JSON.stringify(mem.records)); localStorage.setItem(KEY + \"_set\", JSON.stringify(mem.settings)); saveFail = false; return true; }\n  catch(e){ saveFail = true; return false; }\n}\nfunction logEv(ses, etapa, act, contenido, pregunta, resp, ok, intento, seg){\n  if(!rec) return;\n  rec.ev.push([ses, etapa, act, contenido, pregunta, resp, ok, intento, seg, new Date().toLocaleTimeString(\"es-CO\")]);\n  rec.fin = new Date().toLocaleTimeString(\"es-CO\");\n  save();\n}\nfunction show(id){ [\"start\",\"menu\",\"ses\",\"bye\",\"panel\"].forEach(s => $(s).classList.toggle(\"hidden\", s !== id)); window.scrollTo(0, 0); }\nfunction sub(){ $(\"sub\").textContent = \"Uso: \" + mem.settings.modo + \" · Equipo \" + (mem.settings.equipo || \"sin asignar\"); }\n\n/* ---------- dibujo de triángulos ---------- */\nconst COL = {hyp: \"var(--hyp)\", opp: \"var(--opp)\", adj: \"var(--adj)\"};\nfunction triSvg(o){\n  const W = 460, H = 280, aw = 290, ah = 190, y0 = H - 46;\n  const s = Math.min(aw / o.b, ah / o.h), w = o.b * s, hh = o.h * s, x0 = (W - w) / 2;\n  let A = [x0, y0], C = [x0 + w, y0], B = [x0 + w, y0 - hh];\n  if(o.flip){ const f = p => [W - p[0], p[1]]; A = f(A); B = f(B); C = f(C); }\n  const P = {A, B, C}, cx = (A[0] + B[0] + C[0]) / 3, cy = (A[1] + B[1] + C[1]) / 3;\n  const col = o.col || {}, Lb = o.L || [\"\", \"\", \"\"];\n  let g = '<svg viewBox=\"0 0 ' + W + ' ' + H + '\" role=\"img\" aria-label=\"Triángulo rectángulo\" style=\"width:100%;max-width:460px;height:auto;display:block;margin:0 auto\">';\n  const sc = o.scene;\n  if(sc){\n    const dir = Math.sign(C[0] - A[0]);\n    g += '<line x1=\"' + (A[0] - dir * 30) + '\" y1=\"' + y0 + '\" x2=\"' + (C[0] + dir * 30) + '\" y2=\"' + y0 + '\" stroke=\"var(--mute)\" stroke-width=\"2\"/>';\n    if(sc === \"esc\") g += '<rect x=\"' + (dir > 0 ? C[0] : C[0] - 14) + '\" y=\"' + (B[1] - 24) + '\" width=\"14\" height=\"' + (y0 - B[1] + 24) + '\" fill=\"var(--grid)\" stroke=\"var(--mute)\"/>';\n    if(sc === \"arbol\") g += '<circle cx=\"' + B[0] + '\" cy=\"' + (B[1] - 6) + '\" r=\"26\" fill=\"#5a9e4b\" fill-opacity=\"0.55\"/>';\n    if(sc === \"poste\") g += '<circle cx=\"' + (B[0] - dir * 80) + '\" cy=\"30\" r=\"14\" fill=\"#f2b632\" fill-opacity=\"0.8\"/>';\n    if(sc === \"cometa\") g += '<polygon points=\"' + B[0] + ',' + (B[1] - 22) + ' ' + (B[0] + 13) + ',' + B[1] + ' ' + B[0] + ',' + (B[1] + 20) + ' ' + (B[0] - 13) + ',' + B[1] + '\" fill=\"#e07a5f\" fill-opacity=\"0.8\"/>';\n  }\n  const side = (p, q, k, wdt, dash) => '<line x1=\"' + p[0] + '\" y1=\"' + p[1] + '\" x2=\"' + q[0] + '\" y2=\"' + q[1] + '\" stroke=\"' + (col[k] || \"var(--ink)\") + '\" stroke-width=\"' + (wdt || 3.5) + '\"' + (dash ? ' stroke-dasharray=\"7 5\"' : \"\") + ' stroke-linecap=\"round\"/>';\n  const hypW = sc === \"esc\" ? 6 : (sc === \"cometa\" ? 2 : 3.5), vertW = (sc === \"arbol\" || sc === \"poste\") ? 7 : 3.5;\n  g += side(A, C, \"base\") + side(C, B, \"vert\", vertW) + side(A, B, \"hyp\", hypW, sc === \"poste\");\n  const dx = Math.sign(A[0] - C[0]);\n  g += '<polyline points=\"' + (C[0] + dx * 15) + ',' + C[1] + ' ' + (C[0] + dx * 15) + ',' + (C[1] - 15) + ' ' + C[0] + ',' + (C[1] - 15) + '\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/>';\n  if(o.ang){\n    const V = o.at === \"B\" ? B : A, P1 = o.at === \"B\" ? A : B, P2 = C, r = 34;\n    const u = p => { const d = Math.hypot(p[0] - V[0], p[1] - V[1]); return [(p[0] - V[0]) / d, (p[1] - V[1]) / d]; };\n    const u1 = u(P1), u2 = u(P2), cr = u1[0] * u2[1] - u1[1] * u2[0];\n    g += '<path d=\"M ' + (V[0] + r * u1[0]) + ' ' + (V[1] + r * u1[1]) + ' A ' + r + ' ' + r + ' 0 0 ' + (cr > 0 ? 1 : 0) + ' ' + (V[0] + r * u2[0]) + ' ' + (V[1] + r * u2[1]) + '\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"2\"/>';\n    let bx = u1[0] + u2[0], by = u1[1] + u2[1]; const bl = Math.hypot(bx, by); bx /= bl; by /= bl;\n    g += '<text x=\"' + (V[0] + (r + 16) * bx) + '\" y=\"' + (V[1] + (r + 16) * by + 5) + '\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"currentColor\">' + esc(o.ang) + \"<\/text>\";\n  }\n  const lab = (p, q, s2) => {\n    if(!s2) return \"\";\n    const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;\n    let nx = -(q[1] - p[1]), ny = q[0] - p[0]; const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;\n    if(nx * (mx - cx) + ny * (my - cy) < 0){ nx = -nx; ny = -ny; }\n    const anc = nx > 0.35 ? \"start\" : (nx < -0.35 ? \"end\" : \"middle\");\n    return '<text x=\"' + (mx + nx * 14) + '\" y=\"' + (my + ny * 14 + (ny > 0.5 ? 12 : 5)) + '\" text-anchor=\"' + anc + '\" font-size=\"14\" font-weight=\"bold\" fill=\"currentColor\">' + esc(s2) + \"<\/text>\";\n  };\n  const lb = o.lab || {};\n  g += lab(A, C, lb.base) + lab(C, B, lb.vert) + lab(A, B, lb.hyp);\n  [\"A\", \"B\", \"C\"].forEach((k, i) => {\n    if(!Lb[i]) return;\n    const p = P[k]; let vx = p[0] - cx, vy = p[1] - cy; const vl = Math.hypot(vx, vy); vx /= vl; vy /= vl;\n    g += '<text x=\"' + (p[0] + vx * 16) + '\" y=\"' + (p[1] + vy * 16 + 5) + '\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"currentColor\">' + esc(Lb[i]) + \"<\/text>\";\n  });\n  return g + \"<\/svg>\";\n}\nfunction ctxHtml(c){\n  if(!c) return \"\";\n  let h = \"\";\n  c.forEach(x => {\n    if(typeof x === \"string\") h += '<div class=\"ctx\">' + esc(x) + \"<\/div>\";\n    else if(x.tri) h += '<div class=\"ctx\">' + triSvg(x.tri) + \"<\/div>\";\n    else if(x.table){ h += '<div class=\"ctx\"><table>'; x.table.forEach((r, k) => { h += \"<tr>\" + r.map(y => (k ? \"<td>\" : \"<th>\") + esc(y) + (k ? \"<\/td>\" : \"<\/th>\")).join(\"\") + \"<\/tr>\"; }); h += \"<\/table><\/div>\"; }\n  });\n  return h;\n}\nconst given = d => d && d.length ? '<div class=\"given\">' + d.map(x => \"<div>\" + esc(x) + \"<\/div>\").join(\"\") + \"<\/div>\" : \"\";\n\n/* ---------- generadores de ejercicios ---------- */\nconst DEF = {\n  hyp: \"Hipotenusa: el lado opuesto al ángulo recto; es el lado más largo.\",\n  opp: \"Cateto opuesto a θ: el lado que está enfrente del ángulo θ.\",\n  adj: \"Cateto adyacente a θ: el lado que forma el ángulo θ junto con la hipotenusa.\"\n};\nconst FOR = {sen: \"sen θ = cateto opuesto ÷ hipotenusa\", cos: \"cos θ = cateto adyacente ÷ hipotenusa\", tan: \"tan θ = cateto opuesto ÷ cateto adyacente\"};\nconst TRIPLES = [[12,16,20],[16,12,20],[7,24,25],[24,7,25],[15,20,25],[20,15,25],[10,24,26],[24,10,26],[20,21,29],[21,20,29]];\nconst LETS = [[\"D\",\"E\",\"F\"],[\"P\",\"Q\",\"R\"],[\"M\",\"N\",\"L\"],[\"R\",\"S\",\"T\"],[\"G\",\"H\",\"K\"],[\"X\",\"Y\",\"Z\"]];\nfunction mkT(at){\n  const [b, h, c] = rnd(TRIPLES), Lt = rnd(LETS); at = at || rnd([\"A\", \"B\"]);\n  const N = {base: Lt[0] + Lt[2], vert: Lt[1] + Lt[2], hyp: Lt[0] + Lt[1]};\n  return {b, h, c, L: Lt, at, N, len: {base: b, vert: h, hyp: c}, opp: at === \"A\" ? \"vert\" : \"base\", adj: at === \"A\" ? \"base\" : \"vert\", flip: Math.random() < 0.5, atL: at === \"A\" ? Lt[0] : Lt[1]};\n}\nfunction tctx(T){\n  return [\"Triángulo \" + T.L.join(\"\") + \". El ángulo recto está en \" + T.L[2] + \" y el ángulo θ está en \" + T.atL + \".\",\n    {tri: {b: T.b, h: T.h, L: T.L, at: T.at, ang: \"θ\", flip: T.flip, lab: {base: T.N.base + \" = \" + T.b, vert: T.N.vert + \" = \" + T.h, hyp: T.N.hyp + \" = \" + T.c}}}];\n}\nconst roleOf = (T, k) => k === \"hyp\" ? \"hyp\" : (k === T.opp ? \"opp\" : \"adj\");\nconst ROLE_FB = {\n  hyp: \"Ese lado está enfrente del ángulo recto y es el más largo: es la hipotenusa.\",\n  opp: \"Ese lado está enfrente del ángulo θ: es el cateto opuesto.\",\n  adj: \"Ese lado toca el vértice donde está θ y no es la hipotenusa: es el cateto adyacente.\"\n};\nfunction sideStep(T, target, q){\n  const opts = [\"base\", \"vert\", \"hyp\"].map(k => ({t: T.N[k] + \", que mide \" + T.len[k], ok: roleOf(T, k) === target, fb: ROLE_FB[roleOf(T, k)]}));\n  opts.push({t: \"Ningún lado\", ok: false, fb: \"Todo triángulo rectángulo tiene una hipotenusa y dos catetos.\"});\n  const k = target === \"hyp\" ? \"hyp\" : T[target];\n  const ex = {\n    hyp: T.N.hyp + \" está enfrente del ángulo recto, que está en \" + T.L[2] + \", y mide \" + T.c + \": es el lado más largo.\",\n    opp: T.N[k] + \" está enfrente del vértice \" + T.atL + \", donde está θ.\",\n    adj: T.N[k] + \" sale del vértice \" + T.atL + \", donde está θ, y no es la hipotenusa.\"\n  }[target];\n  return {q, data: [DEF[target]], opts: shuffle(opts), expl: ex};\n}\nfunction valStep(T, fn, fracOnly){\n  const o = T.len[T.opp], a = T.len[T.adj], h = T.c;\n  const C = {sen: [o, h], cos: [a, h], tan: [o, a], senI: [h, o], cosI: [h, a], tanI: [a, o]};\n  const NM = {sen: \"el seno\", cos: \"el coseno\", tan: \"la tangente\"};\n  const FB = {\n    sen: \"Esa división es cateto opuesto ÷ hipotenusa: es el seno.\",\n    cos: \"Esa división es cateto adyacente ÷ hipotenusa: es el coseno.\",\n    tan: \"Esa división es cateto opuesto ÷ cateto adyacente: es la tangente.\",\n    senI: \"Esa división está al revés: pone la hipotenusa arriba. El seno pone el cateto opuesto arriba y la hipotenusa abajo.\",\n    cosI: \"Esa división está al revés: pone la hipotenusa arriba. El coseno pone el cateto adyacente arriba y la hipotenusa abajo.\",\n    tanI: \"Esa división está al revés: pone el cateto adyacente arriba. La tangente pone el cateto opuesto arriba.\"\n  };\n  const keys = {sen: [\"sen\", \"cos\", \"tan\", \"senI\"], cos: [\"cos\", \"sen\", \"tan\", \"cosI\"], tan: [\"tan\", \"sen\", \"cos\", \"tanI\"]}[fn];\n  const tx = k => fracOnly ? C[k][0] + \"/\" + C[k][1] : ratio(C[k][0], C[k][1]);\n  const opts = keys.map(k => ({t: tx(k), ok: k === fn, fb: FB[k] + (k !== fn && NM[k] ? \" Aquí se pide \" + NM[fn] + \".\" : \"\")}));\n  const nm = {sen: \"cateto opuesto\", cos: \"cateto adyacente\", tan: \"cateto opuesto\"}[fn], den = fn === \"tan\" ? \"cateto adyacente\" : \"hipotenusa\";\n  return {q: fracOnly ? \"¿Qué fracción es igual a \" + fn + \" θ?\" : \"¿Cuánto vale \" + fn + \" θ?\", data: [FOR[fn]], opts: shuffle(opts),\n    expl: fn + \" θ = \" + nm + \" ÷ \" + den + \" = \" + ratio(C[fn][0], C[fn][1]) + \".\"};\n}\nconst PEOPLE = [\"Mateo\", \"Valentina\", \"Sofía\", \"Daniel\", \"Sara\", \"Samuel\", \"Mariana\", \"Tomás\"];\nconst RNAME = {sen: \"seno\", cos: \"coseno\", tan: \"tangente\"};\nconst RART = {sen: \"el seno\", cos: \"el coseno\", tan: \"la tangente\"};\n\nconst GEN = {\n  hip: () => { const T = mkT(); const s = sideStep(T, \"hyp\", \"En el triángulo \" + T.L.join(\"\") + \", ¿cuál lado es la hipotenusa?\"); return {ses: 1, content: \"Hipotenusa\", ctx: tctx(T), stem: s.q, data: s.data, opts: s.opts, expl: s.expl}; },\n  opp: () => { const T = mkT(); const s = sideStep(T, \"opp\", \"¿Cuál lado es el cateto opuesto a θ?\"); return {ses: 1, content: \"Catetos opuesto y adyacente\", ctx: tctx(T), stem: s.q, data: s.data, opts: s.opts, expl: s.expl}; },\n  adj: () => { const T = mkT(); const s = sideStep(T, \"adj\", \"¿Cuál lado es el cateto adyacente a θ?\"); return {ses: 1, content: \"Catetos opuesto y adyacente\", ctx: tctx(T), stem: s.q, data: s.data, opts: s.opts, expl: s.expl}; },\n  sen: () => { const T = mkT(); return {ses: 1, content: \"Seno de un ángulo agudo\", ctx: tctx(T), stem: \"¿Cuánto vale sen θ en el triángulo \" + T.L.join(\"\") + \"?\", steps: [sideStep(T, \"opp\", \"¿Cuál lado es el cateto opuesto a θ?\"), valStep(T, \"sen\")]}; },\n  cos: () => { const T = mkT(); return {ses: 1, content: \"Coseno de un ángulo agudo\", ctx: tctx(T), stem: \"¿Cuánto vale cos θ en el triángulo \" + T.L.join(\"\") + \"?\", steps: [sideStep(T, \"adj\", \"¿Cuál lado es el cateto adyacente a θ?\"), valStep(T, \"cos\")]}; },\n  fracCos: () => { const T = mkT(); const s = valStep(T, \"cos\", true); return {ses: 1, content: \"Coseno de un ángulo agudo\", ctx: tctx(T), stem: \"¿Qué fracción es igual a cos θ en el triángulo \" + T.L.join(\"\") + \"?\", data: s.data, opts: s.opts, expl: s.expl}; },\n  fracSen: () => { const T = mkT(); const s = valStep(T, \"sen\", true); return {ses: 1, content: \"Seno de un ángulo agudo\", ctx: tctx(T), stem: \"¿Qué fracción es igual a sen θ en el triángulo \" + T.L.join(\"\") + \"?\", data: s.data, opts: s.opts, expl: s.expl}; },\n  arg1: f => {\n    const T = mkT(), fn = f || rnd([\"sen\", \"cos\"]), who = rnd(PEOPLE), good = Math.random() < 0.4;\n    const top = fn === \"sen\" ? T.len[T.opp] : T.len[T.adj], cat = fn === \"sen\" ? \"cateto opuesto\" : \"cateto adyacente\", otro = fn === \"sen\" ? \"cateto adyacente\" : \"cateto opuesto\";\n    const claim = good ? top + \"/\" + T.c : T.c + \"/\" + top;\n    const opts = good ? [\n      {t: \"Sí: \" + RART[fn] + \" divide el \" + cat + \" (\" + top + \") entre la hipotenusa (\" + T.c + \")\", ok: true},\n      {t: \"No: \" + RART[fn] + \" divide la hipotenusa entre el \" + cat, ok: false, fb: \"Es al revés: la hipotenusa va abajo. Por eso \" + fn + \" θ nunca pasa de 1.\"},\n      {t: \"No: \" + RART[fn] + \" usa el \" + otro, ok: false, fb: FOR[fn] + \". El \" + otro + \" no entra en \" + RART[fn] + \".\"},\n      {t: \"Sí: el orden de la división no importa\", ok: false, fb: \"El orden sí importa: \" + top + \"/\" + T.c + \" y \" + T.c + \"/\" + top + \" dan números distintos.\"}\n    ] : [\n      {t: \"No: \" + RART[fn] + \" divide el \" + cat + \" entre la hipotenusa, no al revés\", ok: true},\n      {t: \"Sí: \" + RART[fn] + \" divide la hipotenusa entre el \" + cat, ok: false, fb: FOR[fn] + \". La hipotenusa va abajo.\"},\n      {t: \"Sí: el orden de la división no importa\", ok: false, fb: \"El orden sí importa: \" + top + \"/\" + T.c + \" y \" + T.c + \"/\" + top + \" dan números distintos.\"},\n      {t: \"No: \" + RART[fn] + \" usa el \" + otro, ok: false, fb: FOR[fn] + \". El \" + otro + \" no entra en \" + RART[fn] + \".\"}\n    ];\n    return {ses: 1, content: fn === \"sen\" ? \"Seno de un ángulo agudo\" : \"Coseno de un ángulo agudo\", ctx: tctx(T), stem: \"¿Tiene razón \" + who + \" al decir que \" + fn + \" θ = \" + claim + \"?\",\n      data: [FOR[fn], who + ' dice: \"' + fn + \" θ = \" + claim + '\".'], opts: shuffle(opts), expl: fn + \" θ = \" + cat + \" ÷ hipotenusa = \" + ratio(top, T.c) + \".\"};\n  },\n  tan: () => { const T = mkT(); return {ses: 2, content: \"Tangente de un ángulo agudo\", ctx: tctx(T), stem: \"¿Cuánto vale tan θ en el triángulo \" + T.L.join(\"\") + \"?\", steps: [sideStep(T, \"opp\", \"¿Cuál lado es el cateto opuesto a θ?\"), sideStep(T, \"adj\", \"¿Cuál lado es el cateto adyacente a θ?\"), valStep(T, \"tan\")]}; },\n  fracTan: () => { const T = mkT(); const s = valStep(T, \"tan\", true); return {ses: 2, content: \"Tangente de un ángulo agudo\", ctx: tctx(T), stem: \"¿Qué fracción es igual a tan θ en el triángulo \" + T.L.join(\"\") + \"?\", data: s.data, opts: s.opts, expl: s.expl}; },\n  choose: () => {\n    const deg = rnd([25, 35, 40, 50, 55, 65]), m = rnd([6, 8, 9, 12, 15]);\n    const pair = rnd([[\"opp\", \"hyp\"], [\"hyp\", \"opp\"], [\"adj\", \"hyp\"], [\"hyp\", \"adj\"], [\"opp\", \"adj\"], [\"adj\", \"opp\"]]);\n    const at = rnd([\"A\", \"B\"]), shape = rnd([[4, 3], [3, 4], [5, 3], [3, 5]]);\n    const key = r => r === \"hyp\" ? \"hyp\" : (r === \"opp\" ? (at === \"A\" ? \"vert\" : \"base\") : (at === \"A\" ? \"base\" : \"vert\"));\n    const lab = {base: \"\", vert: \"\", hyp: \"\"}; lab[key(pair[0])] = m + \" m\"; lab[key(pair[1])] = \"?\";\n    const RN = {hyp: \"La hipotenusa\", opp: \"El cateto opuesto a \" + deg + \"°\", adj: \"El cateto adyacente a \" + deg + \"°\"};\n    const rn = {hyp: \"la hipotenusa\", opp: \"el cateto opuesto\", adj: \"el cateto adyacente\"};\n    const sopt = target => shuffle([\"hyp\", \"opp\", \"adj\"].map(r => ({t: RN[r], ok: r === target, fb: {hyp: \"La hipotenusa es el lado que está enfrente del ángulo recto.\", opp: \"El cateto opuesto está enfrente del ángulo de \" + deg + \"°.\", adj: \"El cateto adyacente toca el ángulo de \" + deg + \"° y no es la hipotenusa.\"}[r] + \" Ese no es el lado que se pregunta.\"})).concat([{t: \"Ningún lado\", ok: false, fb: \"El lado sí existe: es uno de los tres lados del triángulo.\"}]));\n    const set = [pair[0], pair[1]].sort().join(\",\"), fn = {\"hyp,opp\": \"sen\", \"adj,hyp\": \"cos\", \"adj,opp\": \"tan\"}[set];\n    const ropts = shuffle([\"sen\", \"cos\", \"tan\"].map(f => ({t: RNAME[f][0].toUpperCase() + RNAME[f].slice(1), ok: f === fn, fb: FOR[f] + \". No relaciona esos dos lados.\"})).concat([{t: \"Ninguna\", ok: false, fb: \"Siempre hay una razón que relaciona dos lados de un triángulo rectángulo.\"}]));\n    return {ses: 2, content: \"Elección de la razón trigonométrica\",\n      ctx: [\"Se conocen el ángulo de \" + deg + \"° y el lado que mide \" + m + \" m. Se quiere hallar el lado marcado con el signo ?.\", {tri: {b: shape[0], h: shape[1], at, ang: deg + \"°\", lab, flip: Math.random() < 0.5}}],\n      stem: \"¿Qué razón trigonométrica sirve para hallar el lado marcado con el signo ?\",\n      steps: [\n        {q: \"Respecto al ángulo de \" + deg + \"°, ¿qué lado es el que mide \" + m + \" m?\", data: [DEF.hyp, DEF.opp.replace(/θ/g, deg + \"°\"), DEF.adj.replace(/θ/g, deg + \"°\")], opts: sopt(pair[0]), expl: \"El lado que conoces, de \" + m + \" m, es \" + rn[pair[0]] + \".\"},\n        {q: \"Respecto al ángulo de \" + deg + \"°, ¿qué lado es el marcado con el signo ?\", data: [DEF.hyp, DEF.opp.replace(/θ/g, deg + \"°\"), DEF.adj.replace(/θ/g, deg + \"°\")], opts: sopt(pair[1]), expl: \"El lado que buscas es \" + rn[pair[1]] + \".\"},\n        {q: \"¿Qué razón trigonométrica relaciona \" + rn[pair[0]] + \" con \" + rn[pair[1]] + \"?\", data: [FOR.sen, FOR.cos, FOR.tan], opts: ropts, expl: FOR[fn] + \": es la única de las tres que usa esos dos lados.\"}\n      ]};\n  },\n  arg2: () => {\n    const who = rnd(PEOPLE), deg = rnd([30, 40, 50, 60]);\n    const pair = rnd([[\"adj\", \"opp\", \"tan\"], [\"hyp\", \"opp\", \"sen\"], [\"hyp\", \"adj\", \"cos\"], [\"opp\", \"adj\", \"tan\"]]);\n    const rn = {hyp: \"la hipotenusa\", opp: \"el cateto opuesto\", adj: \"el cateto adyacente\"};\n    const good = Math.random() < 0.4, wrong = rnd([\"sen\", \"cos\", \"tan\"].filter(f => f !== pair[2]));\n    const said = good ? pair[2] : wrong;\n    const fn = pair[2];\n    const opts = good ? [\n      {t: \"Sí: \" + RART[fn] + \" es la razón que relaciona \" + rn[pair[0]] + \" con \" + rn[pair[1]], ok: true},\n      {t: \"No: hay que usar \" + RART[wrong], ok: false, fb: FOR[wrong] + \". No usa los dos lados del problema.\"},\n      {t: \"No: \" + RART[fn] + \" solo sirve para ángulos de 45°\", ok: false, fb: \"Las tres razones sirven para cualquier ángulo agudo.\"},\n      {t: \"Sí: cualquier razón sirve para cualquier lado\", ok: false, fb: \"Cada razón relaciona dos lados fijos. Hay que elegir la que usa los dos lados del problema.\"}\n    ] : [\n      {t: \"No: la razón que relaciona \" + rn[pair[0]] + \" con \" + rn[pair[1]] + \" es \" + RART[fn], ok: true},\n      {t: \"Sí: cualquier razón sirve para cualquier lado\", ok: false, fb: \"Cada razón relaciona dos lados fijos. Hay que elegir la que usa los dos lados del problema.\"},\n      {t: \"Sí: \" + RART[said] + \" relaciona \" + rn[pair[0]] + \" con \" + rn[pair[1]], ok: false, fb: FOR[said] + \". Mira cuáles lados usa.\"},\n      {t: \"No: hay que usar \" + RART[[\"sen\", \"cos\", \"tan\"].find(f => f !== fn && f !== said)], ok: false, fb: FOR[[\"sen\", \"cos\", \"tan\"].find(f => f !== fn && f !== said)] + \". No usa los dos lados del problema.\"}\n    ];\n    return {ses: 2, content: \"Elección de la razón trigonométrica\", ctx: [who + \" conoce \" + rn[pair[0]] + \" de un triángulo rectángulo con un ángulo de \" + deg + \"° y quiere hallar \" + rn[pair[1]] + \".\"],\n      stem: \"¿Tiene razón \" + who + \" al decir que debe usar \" + RART[said] + \"?\",\n      data: [FOR.sen, FOR.cos, FOR.tan, who + ' dice: \"Para eso uso ' + RART[said] + '\".'], opts: shuffle(opts), expl: FOR[fn] + \". Es la razón que usa \" + rn[pair[0]] + \" y \" + rn[pair[1]] + \".\"};\n  }\n};\n\n/* problemas de alturas y distancias */\nconst SCN = {\n  escAlt: {fn: \"sen\", known: \"hyp\", sought: \"opp\", kn: \"escalera\", sn: \"altura\", scene: \"esc\", content: \"Aplicación del seno: altura\",\n    txt: (m, d) => \"Una escalera de \" + m + \" m está apoyada en una pared y forma un ángulo de \" + d + \"° con el suelo. Se quiere saber a qué altura de la pared llega.\", q: \"¿A qué altura de la pared llega la escalera?\", lab: m => ({hyp: \"escalera: \" + m + \" m\", vert: \"altura: ?\", base: \"suelo\"})},\n  escPie: {fn: \"cos\", known: \"hyp\", sought: \"adj\", kn: \"escalera\", sn: \"distancia a la pared\", scene: \"esc\", content: \"Aplicación del coseno: distancia\",\n    txt: (m, d) => \"Una escalera de \" + m + \" m está apoyada en una pared y forma un ángulo de \" + d + \"° con el suelo. Se quiere saber a qué distancia de la pared está el pie de la escalera.\", q: \"¿A qué distancia de la pared está el pie de la escalera?\", lab: m => ({hyp: \"escalera: \" + m + \" m\", vert: \"pared\", base: \"distancia: ?\"})},\n  arbol: {fn: \"tan\", known: \"adj\", sought: \"opp\", kn: \"distancia al árbol\", sn: \"altura del árbol\", scene: \"arbol\", content: \"Aplicación de la tangente: altura\",\n    txt: (m, d) => \"Desde un punto del suelo que está a \" + m + \" m del pie de un árbol, la punta del árbol se ve con un ángulo de \" + d + \"°. Se quiere hallar la altura del árbol.\", q: \"¿Cuánto mide la altura del árbol?\", lab: m => ({hyp: \"\", vert: \"altura: ?\", base: \"distancia: \" + m + \" m\"})},\n  poste: {fn: \"tan\", known: \"adj\", sought: \"opp\", kn: \"sombra\", sn: \"altura del poste\", scene: \"poste\", content: \"Aplicación de la tangente: altura\",\n    txt: (m, d) => \"Un poste da una sombra de \" + m + \" m en el suelo cuando los rayos del sol forman un ángulo de \" + d + \"° con el suelo. Se quiere hallar la altura del poste.\", q: \"¿Cuánto mide el poste?\", lab: m => ({hyp: \"rayo de sol\", vert: \"poste: ?\", base: \"sombra: \" + m + \" m\"})},\n  cometa: {fn: \"sen\", known: \"hyp\", sought: \"opp\", kn: \"cuerda\", sn: \"altura de la cometa\", scene: \"cometa\", content: \"Aplicación del seno: altura\",\n    txt: (m, d) => \"Una cometa está amarrada a una estaca en el suelo con una cuerda tensa de \" + m + \" m. La cuerda forma un ángulo de \" + d + \"° con el suelo. Se quiere saber a qué altura está la cometa.\", q: \"¿A qué altura está la cometa?\", lab: m => ({hyp: \"cuerda: \" + m + \" m\", vert: \"altura: ?\", base: \"suelo\"})}\n};\nfunction genApp(kind){\n  const S = SCN[kind], d = rnd([30, 40, 50, 60]), m = rnd([6, 8, 12, 15, 20]), v = trig(d), rad = d * Math.PI / 180;\n  const rn = {hyp: \"La hipotenusa\", opp: \"El cateto opuesto\", adj: \"El cateto adyacente\"};\n  const rnl = {hyp: \"la hipotenusa\", opp: \"el cateto opuesto\", adj: \"el cateto adyacente\"};\n  const sopt = (target, what) => shuffle([\"hyp\", \"opp\", \"adj\"].map(r => ({t: rn[r], ok: r === target, fb: {hyp: \"La hipotenusa está enfrente del ángulo recto.\", opp: \"El cateto opuesto está enfrente del ángulo de \" + d + \"°.\", adj: \"El cateto adyacente toca el ángulo de \" + d + \"° y no es la hipotenusa.\"}[r] + \" Mira dónde está \" + what + \" en el dibujo.\"})).concat([{t: \"Ningún lado\", ok: false, fb: \"En el dibujo \" + what + \" es uno de los tres lados del triángulo.\"}]));\n  const ropts = shuffle([\"sen\", \"cos\", \"tan\"].map(f => ({t: RNAME[f][0].toUpperCase() + RNAME[f].slice(1), ok: f === S.fn, fb: FOR[f] + \". No relaciona esos dos lados.\"})).concat([{t: \"Ninguna\", ok: false, fb: \"Siempre hay una razón que relaciona dos lados de un triángulo rectángulo.\"}]));\n  const vals = \"Valores: sen \" + d + \"° ≈ \" + fmt(v.sen) + \"; cos \" + d + \"° ≈ \" + fmt(v.cos) + \"; tan \" + d + \"° ≈ \" + fmt(v.tan);\n  const res = f => m + \" × \" + fmt(v[f]) + \" = \" + fmt(m * v[f]) + \" m\";\n  const other = [\"sen\", \"cos\", \"tan\"].filter(f => f !== S.fn);\n  const despeje = {sen: \"cateto opuesto = hipotenusa × sen θ\", cos: \"cateto adyacente = hipotenusa × cos θ\", tan: \"cateto opuesto = cateto adyacente × tan θ\"}[S.fn];\n  const copts = [\n    {t: res(S.fn), ok: true},\n    {t: res(other[0]), ok: false, fb: \"Multiplicaste por \" + RNAME[other[0]] + \" de \" + d + \"°. Aquí se usa \" + RART[S.fn] + \".\"},\n    {t: res(other[1]), ok: false, fb: \"Multiplicaste por \" + RNAME[other[1]] + \" de \" + d + \"°. Aquí se usa \" + RART[S.fn] + \".\"},\n    {t: m + \" ÷ \" + fmt(v[S.fn]) + \" ≈ \" + fmt(m / v[S.fn]) + \" m\", ok: false, fb: \"Dividiste. El lado que buscas está arriba en la razón, así que se despeja multiplicando: \" + despeje + \".\"}\n  ];\n  const seen = new Set(), co = []; copts.forEach(o => { if(!seen.has(o.t)){ seen.add(o.t); co.push(o); } });\n  return {ses: 3, content: S.content,\n    ctx: [S.txt(m, d), {tri: {b: Math.cos(rad), h: Math.sin(rad), at: \"A\", ang: d + \"°\", lab: S.lab(m), flip: Math.random() < 0.5, scene: S.scene}}],\n    stem: S.q,\n    steps: [\n      {q: \"Respecto al ángulo de \" + d + \"°, ¿qué lado del triángulo es la \" + S.kn + \"?\", data: [DEF.hyp, DEF.opp.replace(/θ/g, d + \"°\"), DEF.adj.replace(/θ/g, d + \"°\")], opts: sopt(S.known, \"la \" + S.kn), expl: \"La \" + S.kn + \" es \" + rnl[S.known] + \".\"},\n      {q: \"Respecto al ángulo de \" + d + \"°, ¿qué lado del triángulo es la \" + S.sn + \"?\", data: [DEF.hyp, DEF.opp.replace(/θ/g, d + \"°\"), DEF.adj.replace(/θ/g, d + \"°\")], opts: sopt(S.sought, \"la \" + S.sn), expl: \"La \" + S.sn + \" es \" + rnl[S.sought] + \".\"},\n      {q: \"¿Qué razón trigonométrica relaciona \" + rnl[S.known] + \" con \" + rnl[S.sought] + \"?\", data: [FOR.sen, FOR.cos, FOR.tan], opts: ropts, expl: FOR[S.fn] + \".\"},\n      {q: S.q, data: [FOR[S.fn], \"Entonces: \" + despeje, vals, S.kn[0].toUpperCase() + S.kn.slice(1) + \": \" + m + \" m\"], opts: shuffle(co), expl: despeje + \" = \" + res(S.fn) + \".\"}\n    ]};\n}\nGEN.escAlt = () => genApp(\"escAlt\"); GEN.escPie = () => genApp(\"escPie\"); GEN.arbol = () => genApp(\"arbol\"); GEN.poste = () => genApp(\"poste\"); GEN.cometa = () => genApp(\"cometa\");\nGEN.varTab = f => {\n  const fn = f || rnd([\"cos\", \"tan\", \"sen\"]), A = [20, 45, 70], vs = A.map(d => trig(d)[fn]);\n  const up = fn !== \"cos\", a0 = fmt(vs[0]), a2 = fmt(vs[2]);\n  const opts = [\n    {t: (up ? \"Aumenta\" : \"Disminuye\") + \": pasa de \" + a0 + \" a \" + a2, ok: true},\n    {t: (up ? \"Disminuye\" : \"Aumenta\") + \": pasa de \" + a2 + \" a \" + a0, ok: false, fb: \"Leíste la tabla al revés. El ángulo crece de 20° a 70°: mira el valor en 20° y luego en 70°.\"},\n    {t: \"No cambia: siempre vale \" + fmt(vs[1]), ok: false, fb: fmt(vs[1]) + \" es el valor en 45°. En 20° y en 70° el valor es otro.\"},\n    {t: \"Aumenta: pasa de 20 a 70\", ok: false, fb: \"20 y 70 son los ángulos, no los valores de \" + fn + \" θ.\"}\n  ];\n  return {ses: 3, content: \"Variación de las razones con el ángulo\", ctx: [\"Valores de \" + fn + \" θ para tres ángulos agudos.\", {table: [[\"Ángulo θ\", \"20°\", \"45°\", \"70°\"], [fn + \" θ\"].concat(vs.map(fmt))]}],\n    stem: \"Según la tabla, ¿qué pasa con \" + fn + \" θ cuando el ángulo crece de 20° a 70°?\", data: [], opts: shuffle(opts),\n    expl: \"En 20° vale \" + a0 + \" y en 70° vale \" + a2 + \": \" + (up ? \"aumenta\" : \"disminuye\") + \" cuando el ángulo crece.\"};\n};\nGEN.arg3 = f => {\n  const who = rnd(PEOPLE), kind = f || rnd([\"sen\", \"tan\", \"cos\"]);\n  if(kind === \"sen\"){\n    return {ses: 3, content: \"Valor máximo del seno\", ctx: [\"Triángulo rectángulo con un ángulo agudo θ.\", {tri: {b: 4, h: 3, at: \"A\", ang: \"θ\", lab: {base: \"cateto adyacente\", vert: \"cateto opuesto\", hyp: \"hipotenusa\"}}}],\n      stem: \"¿Tiene razón \" + who + \" al decir que sen θ puede valer 1,4 si el triángulo es grande?\", data: [FOR.sen, who + ' dice: \"Si el triángulo es grande, sen θ puede valer 1,4\".'],\n      opts: shuffle([\n        {t: \"No: el cateto opuesto siempre es más corto que la hipotenusa, así que la división da menos de 1\", ok: true},\n        {t: \"Sí: en un triángulo grande los lados son más largos y el seno crece\", ok: false, fb: \"Si los lados crecen en la misma proporción, la división da lo mismo: 3/5 = 6/10 = 0,6.\"},\n        {t: \"Sí: sen θ puede valer cualquier número\", ok: false, fb: \"El seno divide un cateto entre la hipotenusa, que es más larga; el resultado queda entre 0 y 1.\"},\n        {t: \"No: sen θ siempre vale 0,5\", ok: false, fb: \"sen θ cambia con el ángulo: sen 30° ≈ 0,5, pero sen 60° ≈ 0,87.\"}\n      ]), expl: \"La hipotenusa es el lado más largo. Al dividir el cateto opuesto entre ella, el resultado es menor que 1 sin importar el tamaño del triángulo.\"};\n  }\n  if(kind === \"tan\"){\n    return {ses: 3, content: \"Valor de la tangente mayor que 1\", ctx: [\"Triángulo rectángulo con un ángulo agudo θ.\", {tri: {b: 3, h: 4, at: \"A\", ang: \"θ\", lab: {base: \"cateto adyacente\", vert: \"cateto opuesto\", hyp: \"hipotenusa\"}}}],\n      stem: \"¿Tiene razón \" + who + \" al decir que tan θ nunca es mayor que 1?\", data: [FOR.tan, who + ' dice: \"tan θ nunca es mayor que 1\".'],\n      opts: shuffle([\n        {t: \"No: si el cateto opuesto es más largo que el adyacente, la división da más de 1; por ejemplo, tan 60° ≈ 1,73\", ok: true},\n        {t: \"Sí: toda división da un número menor que 1\", ok: false, fb: \"Una división da más de 1 cuando el número de arriba es mayor que el de abajo, como 4/3.\"},\n        {t: \"Sí: la tangente usa la hipotenusa, que es el lado más largo\", ok: false, fb: FOR.tan + \". La tangente no usa la hipotenusa.\"},\n        {t: \"No: tan θ siempre es mayor que 1\", ok: false, fb: \"No siempre: tan 30° ≈ 0,58, que es menor que 1.\"}\n      ]), expl: \"En el dibujo, tan θ = 4/3 ≈ 1,33. La tangente pasa de 1 cuando el ángulo pasa de 45°.\"};\n  }\n  return {ses: 3, content: \"Valor máximo del coseno\", ctx: [\"Triángulo rectángulo con un ángulo agudo θ.\", {tri: {b: 4, h: 3, at: \"A\", ang: \"θ\", lab: {base: \"cateto adyacente\", vert: \"cateto opuesto\", hyp: \"hipotenusa\"}}}],\n    stem: \"¿Tiene razón \" + who + \" al decir que cos θ puede valer 1,2?\", data: [FOR.cos, who + ' dice: \"En un triángulo rectángulo, cos θ puede valer 1,2\".'],\n    opts: shuffle([\n      {t: \"No: el cateto adyacente es más corto que la hipotenusa, así que la división da menos de 1\", ok: true},\n      {t: \"Sí: si el triángulo es grande, cos θ puede pasar de 1\", ok: false, fb: \"El tamaño no cambia la razón: si los lados crecen en la misma proporción, la división da lo mismo.\"},\n      {t: \"Sí: cos θ puede valer cualquier número\", ok: false, fb: \"El coseno divide un cateto entre la hipotenusa, que es más larga; el resultado queda entre 0 y 1.\"},\n      {t: \"No: cos θ siempre vale 0,5\", ok: false, fb: \"cos θ cambia con el ángulo: cos 60° ≈ 0,5, pero cos 30° ≈ 0,87.\"}\n    ]), expl: \"El cateto adyacente siempre es más corto que la hipotenusa. Por eso cos θ es menor que 1.\"};\n};\n\nGEN.arg1cos = () => GEN.arg1(\"cos\");\nGEN.varSen = () => GEN.varTab(\"sen\");\nGEN.arg3sen = () => GEN.arg3(\"sen\");\nconst PLAN = {\n  1: {prac: [\"hip\", \"opp\", \"adj\", \"sen\", \"cos\", \"fracCos\", \"arg1cos\", \"arg1\"], chk: [\"hip\", () => rnd([\"opp\", \"adj\"]), \"sen\", \"arg1cos\", \"fracCos\"]},\n  2: {prac: [\"tan\", \"fracTan\", \"choose\", \"choose\", \"arg2\", \"choose\"], chk: [\"tan\", \"choose\", \"fracTan\", \"choose\", \"arg2\"]},\n  3: {prac: [\"escAlt\", \"poste\", \"varSen\", \"arg3sen\", \"arbol\", \"cometa\", \"escPie\", \"varTab\", \"arg3\"], chk: [() => rnd([\"escAlt\", \"cometa\"]), () => rnd([\"poste\", \"arbol\"]), \"varSen\", \"arg3sen\"]}\n};\nconst SESNAME = {1: \"Sesión 1. Hipotenusa, catetos, seno y coseno\", 2: \"Sesión 2. Tangente y elección de la razón\", 3: \"Sesión 3. Alturas, distancias y cambio de las razones\"};\n\n/* ---------- motor de preguntas ---------- */\nfunction runQ(box, q, mode, label, onEnd){\n  const steps = q.steps || [{q: q.stem, data: q.data, opts: q.opts, expl: q.expl}];\n  const etapa = mode === \"check\" ? \"Comprueba\" : \"Practica\";\n  let k = 0, tries = 0, t0 = now(), res = [], locked = false;\n  function draw(scroll){\n    let h = '<p class=\"qnum\">' + esc(label) + \"<\/p>\" + ctxHtml(q.ctx);\n    if(q.steps) h += '<p class=\"stem\">' + esc(q.stem) + '<\/p><p class=\"stat\">Este ejercicio tiene ' + steps.length + \" pasos. Resuelve uno a la vez.<\/p>\";\n    steps.forEach((s, j) => { if(j < k){ const c = s.opts.find(o = esta correcta es \" + L[ci] + \"). \" + s.expl;\n      finishStep();\n    } else {\n      lab.classList.add(\"bad\"); x.checked = false; x.disabled = true;\n      fb.className = \"fb bad\"; fb.textContent = (o.fb || \"Esa no es.\") + \" Intenta otra vez.\";\n    }\n  }\n  function finishStep(){\n    locked = true;\n    box.querySelectorAll('input[name=\"o\"]').forEach(i => i.disabled = true);\n    $(\"bChk\").classList.add(\"hidden\");\n    const b = $(\"bGo\"); b.classList.remove(\"hidden\");\n    b.textContent = k < steps.length - 1 ? \"Siguiente paso\" : \"Continuar\";\n    b.focus({preventScroll: true});\n  }\n  function go(){\n    k++;\n    if(k < steps.length){ tries = 0; t0 = now(); draw(true); return; }\n    onEnd(res);\n  }\n  draw(false);\n}\n\n/* ---------- etapas ---------- */\nfunction stagePractice(){\n  const st = $(\"stage\"), plan = PLAN[curSes].prac;\n  let i = 0, ok = 0, tot = 0;\n  st.innerHTML = '<div class=\"card\"><h3 style=\"margin-top:0\">Practica<\/h3><p class=\"stat\">Si te equivocas, el simulador te explica el error y puedes intentar otra vez. Cuenta como acierto lo que respondes bien al primer intento.<\/p><div class=\"prog\"><i id=\"pbar\" style=\"width:0\"><\/i><\/div><div id=\"qarea\"><\/div><\/div>';\n  function next(){\n    $(\"pbar\").style.width = (i / plan.length * 100) + \"%\";\n    if(i >= plan.length){\n      $(\"qarea\").innerHTML = '<p class=\"score\">Terminaste la práctica.<\/p><p>Acertaste al primer intento ' + ok + \" de \" + tot + \" pasos.<\/p>\" + '<div class=\"row\"><button id=\"bMore\" class=\"sec\">Practicar con ejercicios nuevos<\/button><button id=\"bToChk\">Ir a Comprueba lo que aprendiste<\/button><\/div>';\n      $(\"bMore\").onclick = stagePractice; $(\"bToChk\").onclick = () => openStage(2);\n      return;\n    }\n    const g0 = plan[i], q = GEN[typeof g0 === \"function\" ? g0() : g0]();\n    runQ($(\"qarea\"), q, \"prac\", \"Ejercicio \" + (i + 1) + \" de \" + plan.length, r => { ok += r.reduce((s, x) => s + x, 0); tot += r.length; i++; next(); window.scrollTo(0, $(\"stage\").offsetTop - 10); });\n  }\n  next();\n}\nfunction stageCheck(){\n  const st = $(\"stage\"), plan = PLAN[curSes].chk, t0 = now();\n  const prev = rec.checks.filter(c => c.ses === curSes).length;\n  let i = 0, ok = 0, tot = 0; const det = [];\n  st.innerHTML = '<div class=\"card\"><h3 style=\"margin-top:0\">Comprueba lo que aprendiste<\/h3><p class=\"stat\">Son ' + plan.length + \" preguntas. Cada paso tiene un solo intento y luego ves la explicación. Al final ves tu resultado. La meta es acertar al menos el 80 % de los pasos.<\/p>\" + '<div class=\"prog\"><i id=\"pbar\" style=\"width:0\"><\/i><\/div><div id=\"qarea\"><\/div><\/div>';\n  function next(){\n    $(\"pbar\").style.width = (i / plan.length * 100) + \"%\";\n    if(i >= plan.length){ end(); return; }\n    const g = plan[i], q = GEN[typeof g === \"function\" ? g() : g]();\n    runQ($(\"qarea\"), q, \"check\", \"Comprobación \" + (prev + 1) + \", pregunta \" + (i + 1) + \" de \" + plan.length, r => {\n      const a = r.reduce((s, x) => s + x, 0); ok += a; tot += r.length; det.push([q.content, a, r.length]); i++; next(); window.scrollTo(0, $(\"stage\").offsetTop - 10);\n    });\n  }\n  function end(){\n    const pct = tot ? ok / tot : 0, pass = pct >= 0.8;\n    rec.checks.push({ses: curSes, intento: prev + 1, ok, tot, pct: Math.round(pct * 1000) / 1000, seg: secs(t0), hora: new Date().toLocaleTimeString(\"es-CO\"), det});\n    rec.fin = new Date().toLocaleTimeString(\"es-CO\"); save();\n    const weak = [...new Set(det.filter(d => d[1] < d[2]).map(d => d[0]))];\n    let h = '<p class=\"score\">Acertaste ' + ok + \" de \" + tot + \" pasos (\" + Math.round(pct * 100) + \" %).<\/p>\";\n    h += pass ? '<div class=\"fb good\">Lograste la meta de la sesión.' + (curSes < 3 ? \" Pueden pasar a la siguiente sesión cuando el docente lo indique.\" : \" Completaste las tres sesiones.\") + \"<\/div>\"\n              : '<div class=\"fb bad\">Todavía no llegas al 80 %. Repasa en Practica y vuelve a hacer la comprobación con preguntas nuevas.<\/div>';\n    if(weak.length) h += \"<p>Contenidos para repasar: \" + esc(weak.join(\"; \")) + \".<\/p>\";\n    h += '<div class=\"row\"><button id=\"bAgain\" class=\"sec\">Hacer otra comprobación<\/button><button id=\"bPr\" class=\"sec\">Volver a Practica<\/button><button id=\"bMn\">Volver a las sesiones<\/button><\/div>';\n    $(\"qarea\").innerHTML = h; $(\"pbar\").style.width = \"100%\";\n    $(\"bAgain\").onclick = stageCheck; $(\"bPr\").onclick = () => openStage(1); $(\"bMn\").onclick = menu;\n  }\n  next();\n}\n\n/* ---------- exploración: triángulo que se deforma ---------- */\nconst MIS = {\n  1: [\n    {type: \"click\", at: \"A\", target: \"hyp\", text: \"Reto 1. Toca la hipotenusa del triángulo.\", data: [DEF.hyp], expl: \"AB está enfrente del ángulo recto, que está en C, y es el lado más largo. Por eso es la hipotenusa.\"},\n    {type: \"click\", at: \"A\", target: \"opp\", text: \"Reto 2. El ángulo θ está en A. Toca el cateto opuesto a θ.\", data: [DEF.opp], expl: \"BC está enfrente del vértice A, donde está θ.\"},\n    {type: \"click\", at: \"A\", target: \"adj\", text: \"Reto 3. Toca el cateto adyacente a θ.\", data: [DEF.adj], expl: \"AC sale del vértice A, donde está θ, y no es la hipotenusa.\"},\n    {type: \"click\", at: \"B\", target: \"opp\", text: \"Reto 4. Ahora el ángulo θ está en B. Toca el cateto opuesto a θ.\", data: [DEF.opp], expl: \"Con θ en B, el cateto opuesto es AC. Los catetos cambian de nombre cuando cambia el ángulo; la hipotenusa sigue siendo AB.\"},\n    {type: \"cond\", at: \"A\", text: \"Reto 5. Arrastra el punto B hasta que sen θ sea mayor que 0,8.\", data: [FOR.sen], test: v => v.sen > 0.8,\n      expl: v => \"sen θ = \" + v.h + \" ÷ \" + len(v.hyp) + ap(v.sen) + fmt(v.sen) + \". El seno crece cuando el cateto opuesto se acerca al largo de la hipotenusa. El ángulo quedó en unos \" + Math.round(v.deg) + \"°.\"},\n    {type: \"cond\", at: \
